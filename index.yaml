# Registry index for this repository.
#
# This repo holds Operator scenario packs, so the package names are not
# repository names and cannot be resolved by convention. The Intelligence CLI
# reads this file from the repository root to map them to their sources:
#
#   intelligence registry add https://github.com/ainova-systems/operator-packs.git
#   intelligence package search
#   intelligence package add @ainova-systems/operator-development
#
# A name resolves only through a registry the project has explicitly trusted:
# there is no built-in catalog and no name-to-repository guessing, so adding
# this registry is what makes the names below installable. Versions live in
# this repository's git tags (x.y.z, optional `v`), not in this file: a
# project's range resolves against them and pins the resolved tag and commit
# in its intelligence.lock.
packages:
  "@ainova-systems/operator-development":
    url: "https://github.com/ainova-systems/operator-packs.git"
    path: "packs/development"
    description: "Phase skills the Operator runtime runs for pull-request delivery: intake, plan, implement, review, verify and merge, each also runnable by hand, plus the run contract, the forge contract and its GitHub implementation. Core recommended, optional via profile keys."
  "@ainova-systems/operator-clarification":
    url: "https://github.com/ainova-systems/operator-packs.git"
    path: "packs/clarification"
    description: "The clarification flow: settles queue items waiting on an owner decision, one question at a time in a documentation pull request. Builds on @ainova-systems/operator-development."
